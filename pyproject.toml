[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-ppg-activity"
version = "0.1.0"
description = "Paper-aligned starter for activity-aware PPG heart-rate estimation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "torch>=2.2,<3", "joblib>=1.3,<2"]

[project.optional-dependencies]
boost = ["xgboost>=2,<4"]
dev = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
include = ["deep_ppg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
